<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>wiring</title>
<style>html,body{margin:0;background:#fff}body{width:1080px;height:1500px;overflow:hidden;font-family:"Yu Gothic UI","Yu Gothic","Meiryo",sans-serif}</style></head>
<body>
<svg width="1080" height="1500" viewBox="0 0 1080 1500" xmlns="http://www.w3.org/2000/svg" font-size="24">
  <rect width="1080" height="1500" fill="#fff"/>
  <text x="540" y="60" fill="#1b2a41" font-size="40" font-weight="700" text-anchor="middle">A1S モデム ⇔ 無線機 DATA 端子 配線図</text>
  <text x="540" y="100" fill="#5b6b82" font-size="22" text-anchor="middle">DATA 端子 = 6ピン ミニDIN（9600bps 用 / パケット用の共通配列）</text>

  <!-- A1S -->
  <rect x="40" y="150" width="330" height="700" rx="18" fill="#e3f6ee" stroke="#2fb985" stroke-width="3"/>
  <text x="205" y="195" fill="#167a57" font-size="30" font-weight="700" text-anchor="middle">ESP32-A1S</text>
  <!-- right panel radio -->
  <rect x="710" y="150" width="330" height="700" rx="18" fill="#eef1f6" stroke="#5b6b82" stroke-width="3"/>
  <text x="875" y="195" fill="#33445c" font-size="30" font-weight="700" text-anchor="middle">無線機 DATA</text>
  <text x="875" y="228" fill="#5b6b82" font-size="20" text-anchor="middle">6ピン ミニDIN</text>

  <g font-size="22">
    <!-- A1S terminals -->
    <g fill="#1b2a41">
      <text x="70" y="290" font-weight="700">PHONE 先端（L）</text><text x="70" y="318" fill="#5b6b82" font-size="18">M17 変調出力</text>
      <text x="70" y="470" font-weight="700">LINE IN 先端（L）</text><text x="70" y="498" fill="#5b6b82" font-size="18">M17 入力</text>
      <text x="70" y="650" font-weight="700">GPIO（PTT 用）</text><text x="70" y="678" fill="#c0392b" font-size="18">※ピン未定・ソフト未実装</text>
      <text x="70" y="800" font-weight="700">GND（スリーブ）</text>
    </g>
    <g fill="#9aa9bd"><circle cx="370" cy="300" r="9"/><circle cx="370" cy="480" r="9"/><circle cx="370" cy="660" r="9"/><circle cx="370" cy="790" r="9"/></g>
    <!-- radio pins -->
    <g fill="#1b2a41">
      <text x="740" y="290" font-weight="700">1 番：DATA IN</text><text x="740" y="318" fill="#5b6b82" font-size="18">（PKD）送信データ入力</text>
      <text x="740" y="470" font-weight="700">4 番：DATA OUT 9600</text><text x="740" y="498" fill="#5b6b82" font-size="18">（検波出力・フラット）</text>
      <text x="740" y="650" font-weight="700">3 番：PTT</text><text x="740" y="678" fill="#5b6b82" font-size="18">（PKS）GND に落とすと送信</text>
      <text x="740" y="800" font-weight="700">2 番：GND</text>
    </g>
    <g fill="#9aa9bd"><circle cx="710" cy="300" r="9"/><circle cx="710" cy="480" r="9"/><circle cx="710" cy="660" r="9"/><circle cx="710" cy="790" r="9"/></g>

    <!-- TX line: PHONE tip -> cap -> pot -> pin1 -->
    <path d="M379 300 H430" stroke="#c4891f" stroke-width="4"/>
    <g stroke="#c4891f" stroke-width="4"><path d="M430 280 V320"/><path d="M444 280 V320"/></g>
    <text x="437" y="268" fill="#c4891f" font-size="18" text-anchor="middle">10µF</text>
    <path d="M444 300 H480" stroke="#c4891f" stroke-width="4"/>
    <rect x="480" y="288" width="90" height="24" fill="#fff" stroke="#c4891f" stroke-width="3"/>
    <text x="525" y="268" fill="#c4891f" font-size="18" text-anchor="middle">10kΩ 半固定</text>
    <path d="M525 330 L525 312" stroke="#c4891f" stroke-width="3"/><path d="M518 322 L525 312 L532 322" fill="none" stroke="#c4891f" stroke-width="3"/>
    <path d="M570 300 H600 V360 H570" fill="none" stroke="#c4891f" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="610" y="365" fill="#8a97aa" font-size="16">片端→GND</text>
    <path d="M525 330 V345 H660 V300 H701" fill="none" stroke="#c4891f" stroke-width="4"/>
    <text x="540" y="400" fill="#33445c" font-size="18" text-anchor="middle">送信：レベルを半固定で下げて入れる</text>

    <!-- RX line: pin4 -> cap -> LINE IN -->
    <path d="M701 480 H560" stroke="#3a6fd8" stroke-width="4"/>
    <g stroke="#3a6fd8" stroke-width="4"><path d="M560 460 V500"/><path d="M546 460 V500"/></g>
    <text x="553" y="448" fill="#3a6fd8" font-size="18" text-anchor="middle">1µF</text>
    <path d="M546 480 H379" stroke="#3a6fd8" stroke-width="4"/>
    <text x="540" y="535" fill="#33445c" font-size="18" text-anchor="middle">受信：そのまま入れる（直流だけ切る）</text>

    <!-- PTT: GPIO -> 4.7k -> NPN -> pin3 -->
    <path d="M379 660 H420" stroke="#2fb985" stroke-width="4"/>
    <rect x="420" y="648" width="80" height="24" fill="#fff" stroke="#2fb985" stroke-width="3"/>
    <text x="460" y="638" fill="#167a57" font-size="18" text-anchor="middle">4.7kΩ</text>
    <path d="M500 660 H540" stroke="#2fb985" stroke-width="4"/>
    <circle cx="570" cy="660" r="34" fill="#fff" stroke="#2fb985" stroke-width="3"/>
    <path d="M550 640 V680" stroke="#2fb985" stroke-width="4"/>
    <path d="M540 660 H550" stroke="#2fb985" stroke-width="4"/>
    <path d="M550 650 L585 630" stroke="#2fb985" stroke-width="3"/><path d="M550 670 L585 690" stroke="#2fb985" stroke-width="3"/>
    <path d="M585 630 V600 H690 V660 H701" fill="none" stroke="#2fb985" stroke-width="4"/>
    <path d="M585 690 V790" stroke="#2fb985" stroke-width="4"/>
    <text x="625" y="590" fill="#167a57" font-size="18" text-anchor="middle">C（コレクタ）</text>
    <text x="570" y="725" fill="#167a57" font-size="18" text-anchor="middle">NPN（2SC1815 など）</text>
    <text x="600" y="760" fill="#167a57" font-size="16">E→GND</text>

    <!-- GND -->
    <path d="M379 790 H701" stroke="#1b2a41" stroke-width="4"/>
  </g>

  <!-- unused pins -->
  <text x="875" y="836" fill="#8a97aa" font-size="18" text-anchor="middle">5番(1200用出力)・6番(SQL) は使わない</text>

  <!-- notes -->
  <rect x="40" y="890" width="1000" height="580" rx="18" fill="#fbf6ea" stroke="#e0b65a" stroke-width="2"/>
  <g fill="#33445c" font-size="23">
    <text x="70" y="940" font-weight="700" fill="#1b2a41" font-size="26">大事な点</text>
    <text x="70" y="985">● ピン番号は Icom・Kenwood・八重洲で共通の配列です。ただし</text>
    <text x="96" y="1017">ピンの「位置」は表から見るか裏から見るかで逆になるので、</text>
    <text x="96" y="1049">必ず無線機の取扱説明書の図で確かめてからはんだ付けしてください。</text>
    <text x="70" y="1094">● 無線機側は「9600bps」設定にします（1200 だと M17 は通りません）。</text>
    <text x="70" y="1139">● M17 は 4値FSK なので、マイク端子・スピーカー端子ではうまくいきません</text>
    <text x="96" y="1171">（プリエンファシスや帯域制限で波形がくずれる）。必ず 9600 用の端子で。</text>
    <text x="70" y="1216">● ID-31 / ID-52 などのハンディには 9600 用 DATA 端子がありません。</text>
    <text x="96" y="1248">DATA 端子付きのモービル機・固定機を使います。</text>
    <text x="70" y="1293">● PTT 出力はまだ作っていません（使う GPIO を決めて、次に実装）。</text>
    <text x="70" y="1338">● 送信レベルは、ダミーロードにつないで半固定と「s」の TX level で調整。</text>
    <text x="70" y="1383" fill="#c0392b" font-weight="700">● 電波を出すのは、M17（この装置）が免許に入ってから。</text>
    <text x="70" y="1428" fill="#5b6b82" font-size="20">部品：10µF と 1µF の電解（または積層）コンデンサ、10kΩ 半固定、4.7kΩ、2SC1815、6ピン ミニDIN プラグ</text>
  </g>
</svg>
</body></html>
